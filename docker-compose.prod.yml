# ===========================================
# HomeChef Production Compose
# Nutzt pre-built Images aus ghcr.io.
# Auf dem Server: docker compose pull && docker compose up -d
# ===========================================

services:
  # 1. Datenbank
  rezept_db:
    image: postgres:15
    container_name: homechef_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 2. Backend
  backend:
    image: ghcr.io/pizzapapst/homechef-backend:${HOMECHEF_TAG:-latest}
    container_name: homechef_backend
    ports:
      - "${BACKEND_PORT:-3005}:3000"
    depends_on:
      rezept_db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SPOONACULAR_API_KEY=${SPOONACULAR_API_KEY}
      - DEEPL_KEY=${DEEPL_KEY}
      - HF_MODEL_CACHE=/app/data/whisper-models
    volumes:
      - ./data/whisper-models:/app/data/whisper-models
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/recipes/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - proxy-net

  # 3. Frontend
  frontend:
    image: ghcr.io/pizzapapst/homechef-frontend:${HOMECHEF_TAG:-latest}
    container_name: homechef_frontend
    ports:
      - "${FRONTEND_PORT:-81}:80"
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - proxy-net

networks:
  proxy-net:
    external: true
    name: docker-proxy_proxy-netzwerk
